name: Build Linux packages

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: whitecap-linux

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential dpkg-dev libgtk-4-dev libadwaita-1-dev pkg-config rpm

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Set package metadata
        id: package
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "architecture=$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        env:
          VERSION: ${{ steps.package.outputs.version }}
          ARCHITECTURE: ${{ steps.package.outputs.architecture }}
        run: |
          package_root="$RUNNER_TEMP/whitecap-deb"
          install -D -m 0755 target/release/whitecap "$package_root/usr/bin/whitecap"
          install -D -m 0644 packaging/io.github.whitecap.Archive.desktop \
            "$package_root/usr/share/applications/io.github.whitecap.Archive.desktop"
          install -D -m 0644 packaging/io.github.whitecap.Archive-mime.xml \
            "$package_root/usr/share/mime/packages/io.github.whitecap.Archive.xml"
          install -d "$package_root/DEBIAN"
          shlibdeps_root="$RUNNER_TEMP/whitecap-shlibdeps"
          install -d "$shlibdeps_root/debian"
          cat > "$shlibdeps_root/debian/control" <<'EOF'
          Source: whitecap
          Section: utils
          Priority: optional
          Maintainer: Whitecap contributors
          Standards-Version: 4.6.2

          Package: whitecap
          Architecture: any
          Description: GTK archive browser for GNOME
           Browse and extract common archive formats with a GTK 4 and libadwaita interface.
          EOF
          dependencies="$(
            cd "$shlibdeps_root"
            dpkg-shlibdeps -O -e "$GITHUB_WORKSPACE/target/release/whitecap"
          )"
          dependencies="${dependencies#shlibs:Depends=}"
          cat > "$package_root/DEBIAN/control" <<EOF
          Package: whitecap
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: $ARCHITECTURE
          Maintainer: Whitecap contributors
          Depends: $dependencies, desktop-file-utils, shared-mime-info
          Description: GTK archive browser for GNOME
           Browse and extract common archive formats with a GTK 4 and libadwaita interface.
          EOF
          cat > "$package_root/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if [ -x /usr/bin/update-mime-database ]; then
            /usr/bin/update-mime-database /usr/share/mime
          fi
          if [ -x /usr/bin/update-desktop-database ]; then
            /usr/bin/update-desktop-database /usr/share/applications
          fi
          EOF
          cat > "$package_root/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -e
          if [ -x /usr/bin/update-mime-database ]; then
            /usr/bin/update-mime-database /usr/share/mime
          fi
          if [ -x /usr/bin/update-desktop-database ]; then
            /usr/bin/update-desktop-database /usr/share/applications
          fi
          EOF
          chmod 0755 "$package_root/DEBIAN/postinst" "$package_root/DEBIAN/postrm"
          mkdir -p dist
          dpkg-deb --root-owner-group --build "$package_root" \
            "dist/whitecap_${VERSION}_${ARCHITECTURE}.deb"

      - name: Build RPM package
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          rpm_root="$RUNNER_TEMP/whitecap-rpm"
          mkdir -p "$rpm_root"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          install -m 0755 target/release/whitecap "$rpm_root/SOURCES/whitecap"
          install -m 0644 packaging/io.github.whitecap.Archive.desktop \
            "$rpm_root/SOURCES/io.github.whitecap.Archive.desktop"
          install -m 0644 packaging/io.github.whitecap.Archive-mime.xml \
            "$rpm_root/SOURCES/io.github.whitecap.Archive-mime.xml"
          cat > "$rpm_root/SPECS/whitecap.spec" <<'EOF'
          Name:           whitecap
          Version:        %{version}
          Release:        1%{?dist}
          Summary:        GTK archive browser for GNOME
          License:        Unknown
          BuildArch:      x86_64
          Requires:       glibc
          Requires:       gtk4 >= 4.10.0
          Requires:       libadwaita >= 1.5.0
          Requires:       desktop-file-utils
          Requires:       shared-mime-info

          %description
          Browse and extract common archive formats with a GTK 4 and libadwaita interface.

          %install
          install -D -m 0755 %{_sourcedir}/whitecap %{buildroot}%{_bindir}/whitecap
          install -D -m 0644 %{_sourcedir}/io.github.whitecap.Archive.desktop \
            %{buildroot}%{_datadir}/applications/io.github.whitecap.Archive.desktop
          install -D -m 0644 %{_sourcedir}/io.github.whitecap.Archive-mime.xml \
            %{buildroot}%{_datadir}/mime/packages/io.github.whitecap.Archive.xml

          %post
          /usr/bin/update-mime-database /usr/share/mime || :
          /usr/bin/update-desktop-database /usr/share/applications || :

          %postun
          /usr/bin/update-mime-database /usr/share/mime || :
          /usr/bin/update-desktop-database /usr/share/applications || :

          %files
          %{_bindir}/whitecap
          %{_datadir}/applications/io.github.whitecap.Archive.desktop
          %{_datadir}/mime/packages/io.github.whitecap.Archive.xml
          EOF
          rpmbuild --define "_topdir $rpm_root" --define "version $VERSION" \
            -bb "$rpm_root/SPECS/whitecap.spec"
          mkdir -p dist
          find "$rpm_root/RPMS" -type f -name '*.rpm' -exec cp {} dist/ \;

      - name: Publish GitHub release
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
          startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_type == 'tag' && format('Whitecap {0}', github.ref_name) || format('Whitecap build #{0}', github.run_number) }}"
          tag_name: "${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}"
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
