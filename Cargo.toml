[package]
name = "whitecap"
version = "1.2.2"
edition = "2024"

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
unarc-rs = "0.8"
bzip2 = "0.5"
flate2 = "1"
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
tar = "0.4"
sevenz-rust2 = "0.24"
tempfile = "3"
unrar-rs = "0.12"
xz2 = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }
zstd = "0.13"
